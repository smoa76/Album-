<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── CONFIGURA FIREBASE AQUÍ ──────────────────────────────────────────────────
// 1. Ve a https://console.firebase.google.com
// 2. Crea un proyecto gratuito
// 3. Añade una app web y copia aquí la configuración
const firebaseConfig = {
  apiKey: "AIzaSyDyfMUbcO6w5iUvgDhyTcrczG5RgoVfPmo",
  authDomain: "panini2026-bb855.firebaseapp.com",
  databaseURL: "https://panini2026-bb855-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "panini2026-bb855",
  storageBucket: "panini2026-bb855.firebasestorage.app",
  messagingSenderId: "50502182627",
  appId: "1:50502182627:web:e7772752b37a60720787d6"
};
// ─────────────────────────────────────────────────────────────────────────────

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const ALBUM_KEY = "panini2026"; // cambia esto si quieres tener varios álbumes

window._fbSave = (ownedArray) => {
  set(ref(db, ALBUM_KEY), { cromos: ownedArray });
};

window._fbListen = (callback) => {
  onValue(ref(db, ALBUM_KEY), (snapshot) => {
    const data = snapshot.val();
    callback(data ? data.cromos : []);
  });
};
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a227;
    --gold-light: #e8c547;
    --gold-dark: #a07820;
    --blue: #4a9eff;
    --green: #64c878;
    --red: #ff5f5f;
    --bg: #080b14;
    --surface: rgba(255,255,255,.05);
    --border: rgba(255,255,255,.08);
  }

  body {
    font-family: 'Barlow Condensed', sans-serif;
    background: var(--bg);
    color: #fff;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 2px; }

  /* ── HEADER ── */
  #header {
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 45%, var(--gold) 100%);
    padding: 14px 16px 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 24px rgba(201,162,39,.45);
  }
  #header-inner { display: flex; justify-content: space-between; align-items: flex-start; }
  #header-label { font-size: 10px; font-weight: 700; letter-spacing: 3px; color: rgba(0,0,0,.5); text-transform: uppercase; }
  #header-title { font-size: 22px; font-weight: 900; color: #000; line-height: 1.1; }
  #header-right { text-align: right; }
  #header-pct { font-size: 30px; font-weight: 900; color: #000; line-height: 1; }
  #header-count { font-size: 10px; color: rgba(0,0,0,.5); font-weight: 700; letter-spacing: 1px; }
  #sync-indicator { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: rgba(0,0,0,.45); margin-top: 2px; min-height: 14px; text-align: right; }
  #progress-bar { height: 5px; background: rgba(0,0,0,.2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  #progress-fill { height: 100%; background: #000; border-radius: 3px; transition: width .5s ease; width: 0%; }
  #back-btn { background: rgba(0,0,0,.2); border: none; color: #000; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; padding: 2px 8px; border-radius: 3px; margin-bottom: 4px; display: none; }

  /* ── CONTROLS ── */
  #controls { padding: 10px 14px 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #search { flex: 1; min-width: 140px; background: rgba(255,255,255,.07); border: 1px solid rgba(201,162,39,.3); border-radius: 6px; padding: 7px 12px; color: #fff; font-size: 14px; outline: none; font-family: 'Barlow Condensed', sans-serif; }
  #search::placeholder { color: rgba(255,255,255,.3); }
  .filter-btns { display: flex; gap: 4px; }
  .fbtn { padding: 7px 11px; border-radius: 5px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); border: none; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; transition: all .12s; }
  .fbtn.active { background: var(--gold); color: #000; }

  /* ── SECTIONS VIEW ── */
  #sections-view { padding: 6px 14px 90px; }
  .group-label { font-size: 11px; font-weight: 800; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; margin-bottom: 8px; border-left: 3px solid var(--gold); padding-left: 8px; }
  .group-block { margin-bottom: 20px; }
  .sections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .sec-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: transform .18s, box-shadow .18s; }
  .sec-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,162,39,.2); }
  .sec-card.complete { background: linear-gradient(135deg,rgba(201,162,39,.22),rgba(201,162,39,.08)); border-color: rgba(201,162,39,.55); }
  .sec-emoji { font-size: 22px; margin-bottom: 4px; }
  .sec-name { font-size: 12px; font-weight: 700; color: #fff; line-height: 1.2; margin-bottom: 6px; }
  .sec-card.complete .sec-name { color: var(--gold-light); }
  .sec-bar-bg { height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  .sec-bar-fill { height: 100%; background: var(--blue); border-radius: 2px; transition: width .4s; }
  .sec-card.complete .sec-bar-fill { background: var(--gold); }
  .sec-count { margin-top: 4px; font-size: 11px; color: rgba(255,255,255,.45); font-weight: 600; }
  .sec-check { color: var(--gold); margin-left: 4px; }

  /* ── STICKERS VIEW ── */
  #stickers-view { padding: 8px 14px 90px; display: none; }
  #sec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: var(--surface); border-radius: 8px; padding: 10px 14px; }
  #sec-have { font-size: 22px; font-weight: 800; color: var(--gold); }
  #sec-total { font-size: 13px; color: rgba(255,255,255,.5); margin-left: 4px; }
  #sec-progress { height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; margin-top: 4px; overflow: hidden; width: 100px; }
  #sec-progress-fill { height: 100%; background: var(--gold); }
  #toggle-all-btn { background: rgba(201,162,39,.2); border: 1px solid rgba(201,162,39,.5); color: var(--gold); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .stickers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 8px; }
  .sticker { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 10px 8px; text-align: center; position: relative; cursor: pointer; transition: transform .12s; }
  .sticker:active { transform: scale(.94); }
  .sticker.owned { background: rgba(74,158,255,.2); border-color: rgba(74,158,255,.5); }
  .sticker.owned-foil { background: linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold-dark)); border-color: var(--gold-light); box-shadow: 0 0 14px rgba(201,162,39,.4); }
  .sticker.owned-photo { background: rgba(100,200,120,.2); border-color: rgba(100,200,120,.5); }
  .sticker-id { font-size: 9px; font-weight: 800; letter-spacing: 1px; color: rgba(255,255,255,.3); margin-bottom: 4px; text-transform: uppercase; }
  .sticker.owned .sticker-id { color: rgba(74,158,255,.8); }
  .sticker.owned-foil .sticker-id { color: rgba(0,0,0,.6); }
  .sticker.owned-photo .sticker-id { color: rgba(100,200,120,.8); }
  .sticker-name { font-size: 11px; font-weight: 400; color: rgba(255,255,255,.45); line-height: 1.3; }
  .sticker.owned .sticker-name, .sticker.owned-photo .sticker-name { font-weight: 700; color: #fff; }
  .sticker.owned-foil .sticker-name { font-weight: 700; color: #000; }
  .sticker-check { position: absolute; top: 4px; right: 5px; font-size: 10px; font-weight: 900; color: var(--blue); display: none; }
  .sticker.owned .sticker-check { display: block; }
  .sticker.owned-foil .sticker-check { color: #000; display: block; }
  .sticker.owned-photo .sticker-check { color: var(--green); display: block; }

  /* ── BOTTOM BAR ── */
  #bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(8,11,20,.97); backdrop-filter: blur(12px); border-top: 1px solid rgba(201,162,39,.2); padding: 8px 20px 10px; z-index: 99; }
  .bottom-stats { display: flex; justify-content: space-around; }
  .stat { text-align: center; }
  .stat-val { font-size: 20px; font-weight: 800; line-height: 1; }
  .stat-lbl { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,.35); text-transform: uppercase; }
  #sync-status { text-align: center; font-size: 10px; color: rgba(255,255,255,.2); margin-top: 4px; letter-spacing: 1px; font-weight: 600; min-height: 14px; }

  /* ── EMPTY ── */
  .empty { text-align: center; color: rgba(255,255,255,.35); padding: 40px 20px; font-size: 15px; }
</style>
</head>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────

const INTRO = [
  {id:"00",   name:"Logo Panini (FOIL)"},
  {id:"FWC1", name:"Emblema oficial (FOIL)"},
  {id:"FWC2", name:"Emblema oficial (FOIL)"},
  {id:"FWC3", name:"Mascotas oficiales (FOIL)"},

  {id:"FWC7", name:"México - País anfitrión (FOIL)"},
  {id:"FWC8", name:"USA - País anfitrión (FOIL)"},

const MUSEUM = [
  {id:"FWC9", name:"Italia 1934 (FOIL)"},{id:"FWC10",name:"Uruguay 1950 (FOIL)"},
  {id:"FWC11",name:"Alemania Occ. 1954 (FOIL)"},{id:"FWC12",name:"Brasil 1962 (FOIL)"},
  {id:"FWC13",name:"Alemania Occ. 1974 (FOIL)"},{id:"FWC14",name:"Argentina 1986 (FOIL)"},
  {id:"FWC15",name:"Brasil 1994 (FOIL)"},{id:"FWC16",name:"Brasil 2002 (FOIL)"},
  {id:"FWC17",name:"Italia 2006 (FOIL)"},{id:"FWC18",name:"Alemania 2014 (FOIL)"},
  {id:"FWC19",name:"Argentina 2022 (FOIL)"},
];
const TEAMS = [
  {code:"MEX",name:"México",flag:"🇲🇽",group:"A"},{code:"RSA",name:"Sudáfrica",flag:"🇿🇦",group:"A"},
  {code:"KOR",name:"Corea del Sur",flag:"🇰🇷",group:"A"},{code:"CZE",name:"Rep. Checa",flag:"🇨🇿",group:"A"},
  {code:"CAN",name:"Canadá",flag:"🇨🇦",group:"B"},{code:"BIH",name:"Bosnia y Herz.",flag:"🇧🇦",group:"B"},
  {code:"QAT",name:"Qatar",flag:"🇶🇦",group:"B"},{code:"SUI",name:"Suiza",flag:"🇨🇭",group:"B"},
  {code:"BRA",name:"Brasil",flag:"🇧🇷",group:"C"},{code:"MAR",name:"Marruecos",flag:"🇲🇦",group:"C"},
  {code:"HAI",name:"Haití",flag:"🇭🇹",group:"C"},{code:"SCO",name:"Escocia",flag:"🏴󠁧󠁢󠁳󠁣󠁴󠁿",group:"C"},
  {code:"USA",name:"Estados Unidos",flag:"🇺🇸",group:"D"},{code:"PAR",name:"Paraguay",flag:"🇵🇾",group:"D"},
  {code:"AUS",name:"Australia",flag:"🇦🇺",group:"D"},{code:"TUR",name:"Turquía",flag:"🇹🇷",group:"D"},
  {code:"GER",name:"Alemania",flag:"🇩🇪",group:"E"},{code:"CUW",name:"Curazao",flag:"🇨🇼",group:"E"},
  {code:"CIV",name:"Costa de Marfil",flag:"🇨🇮",group:"E"},{code:"ECU",name:"Ecuador",flag:"🇪🇨",group:"E"},
  {code:"NED",name:"Países Bajos",flag:"🇳🇱",group:"F"},{code:"JPN",name:"Japón",flag:"🇯🇵",group:"F"},
  {code:"SWE",name:"Suecia",flag:"🇸🇪",group:"F"},{code:"TUN",name:"Túnez",flag:"🇹🇳",group:"F"},
  {code:"BEL",name:"Bélgica",flag:"🇧🇪",group:"G"},{code:"EGY",name:"Egipto",flag:"🇪🇬",group:"G"},
  {code:"IRN",name:"Irán",flag:"🇮🇷",group:"G"},{code:"NZL",name:"Nueva Zelanda",flag:"🇳🇿",group:"G"},
  {code:"ESP",name:"España",flag:"🇪🇸",group:"H"},{code:"CPV",name:"Cabo Verde",flag:"🇨🇻",group:"H"},
  {code:"KSA",name:"Arabia Saudí",flag:"🇸🇦",group:"H"},{code:"URU",name:"Uruguay",flag:"🇺🇾",group:"H"},
  {code:"FRA",name:"Francia",flag:"🇫🇷",group:"I"},{code:"SEN",name:"Senegal",flag:"🇸🇳",group:"I"},
  {code:"IRQ",name:"Irak",flag:"🇮🇶",group:"I"},{code:"NOR",name:"Noruega",flag:"🇳🇴",group:"I"},
  {code:"ARG",name:"Argentina",flag:"🇦🇷",group:"J"},{code:"ALG",name:"Argelia",flag:"🇩🇿",group:"J"},
  {code:"AUT",name:"Austria",flag:"🇦🇹",group:"J"},{code:"JOR",name:"Jordania",flag:"🇯🇴",group:"J"},
  {code:"POR",name:"Portugal",flag:"🇵🇹",group:"K"},{code:"COD",name:"RD Congo",flag:"🇨🇩",group:"K"},
  {code:"UZB",name:"Uzbekistán",flag:"🇺🇿",group:"K"},{code:"COL",name:"Colombia",flag:"🇨🇴",group:"K"},
  {code:"ENG",name:"Inglaterra",flag:"🏴󠁧󠁢󠁥󠁮󠁧󠁿",group:"L"},{code:"CRO",name:"Croacia",flag:"🇭🇷",group:"L"},
  {code:"GHA",name:"Ghana",flag:"🇬🇭",group:"L"},{code:"PAN",name:"Panamá",flag:"🇵🇦",group:"L"},
];
const LABELS = [
  "Escudo (FOIL)","Jugador 2","Jugador 3","Jugador 4","Jugador 5","Jugador 6",
  "Jugador 7","Jugador 8","Jugador 9","Jugador 10","Jugador 11","Jugador 12",
  "Foto equipo","Jugador 14","Jugador 15","Jugador 16","Jugador 17","Jugador 18","Jugador 19","Jugador 20",
];

const ALL_SECTIONS = [
  {id:"INTRO", name:"Introducción", emoji:"🏆", stickers:INTRO},
  {id:"MUSEUM",name:"Historia",     emoji:"🏅", stickers:MUSEUM},
  ...TEAMS.map(t => ({
    id:t.code, name:t.name, emoji:t.flag, group:t.group,
    stickers: LABELS.map((label,i) => ({id:`${t.code}${i+1}`, name:label}))
  }))
];
const GROUPS = ["INTRO","MUSEUM","A","B","C","D","E","F","G","H","I","J","K","L"];
const TOTAL = INTRO.length + MUSEUM.length + TEAMS.length * 20;

// ── STATE ─────────────────────────────────────────────────────────────────────

let owned       = new Set();
let filterMode  = "all";
let search      = "";
let activeSecId = null;
let saving      = false;
let saveTimer   = null;

// ── FIREBASE SYNC ─────────────────────────────────────────────────────────────

function initFirebase() {
  if (!window._fbListen) {
    setSyncStatus("⚠ Sin conexión Firebase — modo local");
    loadLocal();
    return;
  }
  setSyncStatus("Conectando…");
  window._fbListen((data) => {
    owned = new Set(data || []);
    saveLocal();
    render();
    setSyncStatus("✓ Sincronizado " + new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit",second:"2-digit"}));
  });
}

function scheduleSave() {
  clearTimeout(saveTimer);
  setSyncIndicator("Guardando…");
  saveTimer = setTimeout(() => {
    if (window._fbSave) {
      window._fbSave([...owned]);
    }
    saveLocal();
    setSyncIndicator("✓ Guardado");
    setTimeout(() => setSyncIndicator(""), 1500);
  }, 600);
}

function saveLocal() {
  try { localStorage.setItem("panini2026_v2", JSON.stringify([...owned])); } catch {}
}
function loadLocal() {
  try {
    const v = localStorage.getItem("panini2026_v2");
    owned = v ? new Set(JSON.parse(v)) : new Set();
  } catch { owned = new Set(); }
}

function setSyncStatus(msg) {
  document.getElementById("sync-status").textContent = msg;
}
function setSyncIndicator(msg) {
  document.getElementById("sync-indicator").textContent = msg;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────

function toggle(id) {
  if (owned.has(id)) owned.delete(id); else owned.add(id);
  scheduleSave();
  render();
}

function toggleAll(section) {
  const ids = section.stickers.map(s => s.id);
  const allHave = ids.every(id => owned.has(id));
  if (allHave) ids.forEach(id => owned.delete(id));
  else ids.forEach(id => owned.add(id));
  scheduleSave();
  render();
}

function openSection(id) {
  activeSecId = id;
  render();
}

function goBack() {
  activeSecId = null;
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function prog(sec) {
  const total = sec.stickers.length;
  const have  = sec.stickers.filter(s => owned.has(s.id)).length;
  return { have, total, pct: Math.round(have/total*100) };
}

function stickerClass(sticker) {
  if (!owned.has(sticker.id)) return "sticker";
  if (sticker.name.includes("FOIL") || sticker.name.includes("Escudo")) return "sticker owned-foil";
  if (sticker.name.includes("Foto")) return "sticker owned-photo";
  return "sticker owned";
}

function render() {
  const totalOwned = owned.size;
  const globalPct  = Math.round(totalOwned / TOTAL * 100);

  // Header
  document.getElementById("header-pct").textContent   = globalPct + "%";
  document.getElementById("header-count").textContent = totalOwned + "/" + TOTAL;
  document.getElementById("progress-fill").style.width = globalPct + "%";

  // Bottom stats
  document.getElementById("stat-tengo").textContent  = totalOwned;
  document.getElementById("stat-faltan").textContent = TOTAL - totalOwned;
  document.getElementById("stat-total").textContent  = TOTAL;

  const currentSec = activeSecId ? ALL_SECTIONS.find(s => s.id === activeSecId) : null;

  if (!currentSec) {
    // ── SECTIONS VIEW ──
    document.getElementById("back-btn").style.display     = "none";
    document.getElementById("header-title").textContent   = "FIFA World Cup 2026™";
    document.getElementById("search").style.display       = "";
    document.getElementById("sections-view").style.display = "";
    document.getElementById("stickers-view").style.display = "none";

    const searchVal = search.toLowerCase();

    const filtered = ALL_SECTIONS.filter(sec => {
      const ok = !searchVal || sec.name.toLowerCase().includes(searchVal);
      if (!ok) return false;
      if (filterMode === "missing") { const { have, total } = prog(sec); return have < total; }
      if (filterMode === "owned")   return prog(sec).have > 0;
      return true;
    });

    let html = "";
    GROUPS.forEach(group => {
      const secs = filtered.filter(s =>
        s.group === group ||
        (group === "INTRO"  && s.id === "INTRO") ||
        (group === "MUSEUM" && s.id === "MUSEUM")
      );
      if (!secs.length) return;
      const label = group==="INTRO"?"INTRODUCCIÓN":group==="MUSEUM"?"HISTORIA DEL MUNDIAL":`GRUPO ${group}`;
      html += `<div class="group-block"><div class="group-label">${label}</div><div class="sections-grid">`;
      secs.forEach(sec => {
        const { have, total, pct } = prog(sec);
        const done = have === total;
        html += `
          <div class="sec-card${done?" complete":""}" onclick="openSection('${sec.id}')">
            <div class="sec-emoji">${sec.emoji}</div>
            <div class="sec-name">${sec.name}</div>
            <div class="sec-bar-bg"><div class="sec-bar-fill" style="width:${pct}%"></div></div>
            <div class="sec-count">${have}/${total}${done?'<span class="sec-check">✓</span>':""}</div>
          </div>`;
      });
      html += `</div></div>`;
    });

    if (!filtered.length) html = '<div class="empty">Sin resultados</div>';
    document.getElementById("sections-view").innerHTML = html;

  } else {
    // ── STICKERS VIEW ──
    document.getElementById("back-btn").style.display     = "block";
    document.getElementById("header-title").textContent   = currentSec.emoji + " " + currentSec.name;
    document.getElementById("search").style.display       = "none";
    document.getElementById("sections-view").style.display = "none";
    document.getElementById("stickers-view").style.display = "";

    const { have, total, pct } = prog(currentSec);
    document.getElementById("sec-have").textContent          = have;
    document.getElementById("sec-total").textContent         = " de " + total;
    document.getElementById("sec-progress-fill").style.width = pct + "%";

    const allHave = currentSec.stickers.every(s => owned.has(s.id));
    document.getElementById("toggle-all-btn").textContent = allHave ? "Desmarcar todos" : "Marcar todos";
    document.getElementById("toggle-all-btn").onclick = () => toggleAll(currentSec);

    const stickers = currentSec.stickers.filter(s => {
      if (filterMode === "missing") return !owned.has(s.id);
      if (filterMode === "owned")   return owned.has(s.id);
      return true;
    });

    if (!stickers.length) {
      document.getElementById("stickers-grid").innerHTML  = "";
      document.getElementById("stickers-empty").style.display = "";
      document.getElementById("stickers-empty").textContent   =
        filterMode === "missing" ? "🎉 ¡Tienes todos los cromos de esta sección!" : "Aún no tienes ninguno aquí.";
    } else {
      document.getElementById("stickers-empty").style.display = "none";
      document.getElementById("stickers-grid").innerHTML = stickers.map(s => `
        <div class="${stickerClass(s)}" onclick="toggle('${s.id}')">
          <div class="sticker-id">${s.id}</div>
          <div class="sticker-name">${s.name}</div>
          <div class="sticker-check">✓</div>
        </div>`).join("");
    }
  }
}

// ── EVENTS ────────────────────────────────────────────────────────────────────

document.getElementById("back-btn").onclick = goBack;
document.getElementById("search").oninput   = e => { search = e.target.value; render(); };

document.querySelectorAll(".fbtn").forEach(btn => {
  btn.onclick = () => {
    filterMode = btn.dataset.filter;
    document.querySelectorAll(".fbtn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
});

// ── INIT ──────────────────────────────────────────────────────────────────────

document.getElementById("stat-total").textContent = TOTAL;
loadLocal();
render();

// Wait for Firebase module to load
setTimeout(initFirebase, 800);
</script>
</body>
</html>
